bundle:
  name: behavior-a2a
  version: 0.1.0
  description: A2A agent-to-agent communication — tool, server hook, and LLM context

# Prevent the A2A server hook from loading in delegated sub-agent sessions.
# The server should only run in the root session — sub-agents don't need their
# own HTTP server and would collide on the port.
spawn:
  exclude_hooks:
    - hooks-a2a-server

tools:
  - module: tool-a2a
    source: git+https://github.com/microsoft/amplifier-bundle-a2a@main#subdirectory=modules/tool-a2a
    config:
      outbound_policy:
        require_https: true
        allowed_hosts: []
        allowed_cidrs: []
        allow_private_networks: false
      authentication:
        peers: {}

hooks:
  - module: hooks-a2a-server
    source: git+https://github.com/microsoft/amplifier-bundle-a2a@main#subdirectory=modules/hooks-a2a-server
    config:
      port: 8222
      skills: []
      known_agents: []
      authentication:
        required: true
        allow_anonymous_first_contact: false
        max_clock_skew_seconds: 300
        peers: {}
      trust_tiers:
        known:
          tools: []
        trusted:
          tools: []

context:
  include:
    - a2a:context/a2a-instructions.md
